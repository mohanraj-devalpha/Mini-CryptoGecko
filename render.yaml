# Render Blueprint specification for CoinScope backend and database
# Deploy via Render Dashboard -> Blueprints -> New Blueprint Instance
version: "1"

databases:
  - name: coinscope-db
    region: singapore
    plan: free
    databaseName: coinscope
    user: coinscope

services:
  - type: web
    name: coinscope-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: coinscope-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SIM_ENABLED
        value: "true"
      - key: SIM_TICK_SECONDS
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "120/minute"
