services:
  db:
    image: postgres:16-alpine
    container_name: coinscope-db
    environment:
      POSTGRES_USER: coinscope
      POSTGRES_PASSWORD: coinscope
      POSTGRES_DB: coinscope
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinscope -d coinscope"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
